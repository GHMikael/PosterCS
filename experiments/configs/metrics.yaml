# 正式 16 指标配置(v5)。键名 = metric_id。改名后保留各自原有调参。
# A — content fidelity
a1_key_info_recall:
  claim_extractor:
    max_claims_per_paper: 25
    model: Qwen/Qwen3-32B
    temperature: 0.0
  enabled: true
  entailment_judge:
    model: Qwen/Qwen3-32B
    temperature: 0.0
    threshold_logprob: 0.6
  gold_validation_kappa_min: 0.7
a2_hallucination_rate:
  contradict_min: 0.5
  enabled: true
  llm_nli:
    model: Qwen/Qwen3-32B
  nli_model: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
  retrieval:
    method: bm25
    top_k: 2
  robustness_check:
    enabled: true
    model: Qwen/Qwen2.5-72B-Instruct
    via: dashscope
a3_semantic_fidelity:
  enabled: true
  lang: en   # 'en' 用 roberta-large + rescale_with_baseline;'zh' 用中文编码器

# B — visual quality
b1_layout_quality:
  auto_geometric:
    grid_columns: 12
    grid_tolerance_px: 5
    weights:
      aspect_extremes: 0.15
      grid_alignment: 0.2
      overlap: 0.25
      reading_order: 0.15
      whitespace: 0.25
  enabled: true
  vlm_judge:
    # v5 注意:VLM 版面打分继承"先验/不可靠"风险 → 以 auto_geometric 为主,
    # VLM 用一个不同于 critic 的模型,且报几何为先(避免循环论证)。
    criteria:
    - balance
    - alignment
    - hierarchy
    - whitespace
    - flow
    model: Qwen/Qwen3-32B
b2_readability:
  delta_lstar_reference: 50
  enabled: true
  font_pt_reference: 24
b3_figure_reuse_rate:
  enabled: true
  report_scope: headline_visual_support
  v3_note: "被 panel 引用的有效原文图 / 有效源图;语义对齐移到 b4_figure_text_align。"
b4_figure_text_align:
  cosine_threshold: 0.28
  embedder: BAAI/AltCLIP-XLMR-L
  enabled: true

# C — protocol（Wave2/#10:c1 改诚实重测、新建 c3_issue_resolution;暂留旧 protocol_metrics）
action_executability:
  enabled: true
  report_scope: headline_protocol
convergence_rate:
  enabled: true
  report_scope: headline_protocol
mean_iters_to_converge:
  enabled: true
  report_scope: headline_protocol
per_iter_visual_gain:
  enabled: true
  report_scope: headline_protocol
c3_issue_resolution_rate:
  enabled: true
  report_scope: headline_protocol   # #10:最值钱的协议指标;注意"消失=解决"由同一 VLM 判,带可靠性 caveat

# D — efficiency
d1_latency:
  enabled: true
  source: experiment_log.jsonl
d2_cost:
  enabled: true
  pricing_table: experiments/tools/pricing.py

# E — external validation
e1_paperquiz:
  answerers:
  - id: qwen_vl_32b
    model: Qwen/Qwen3-VL-32B-Instruct
    temperature: 0.0
  enabled: true
  report_scope: headline_external
  v2_note: "5-MCQ 易饱和;作为 headline 前要难化题目。"
  question_generator:
    max_paper_chars: 16000
    model: Qwen/Qwen3-32B
    n_questions: 5
e2_human_preference:
  enabled: true
  csv_path: experiments/results/human_preference.csv   # 无文件则该指标干净 skip
e3_llm_judge:
  enabled: false   # 默认关(省 API);置 true 才跑;须报与 e2 人评的相关性
  model: Qwen/Qwen3-VL-32B-Instruct

# 内部预检（不计入 16 个 headline 指标）
visual_smoke_check:
  enabled: true
  report_scope: preflight_quality_gate
  v3_note: "便宜的 PPTX 结构性预检:溢出/省略号/顶栏重叠。"
